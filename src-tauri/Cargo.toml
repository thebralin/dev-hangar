[package]
name = "dev-hangar"
version = "0.6.0"
description = "Dev Hangar: все dev-проекты в одном месте"
edition = "2021"

[lib]
name = "devhangar_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
toml = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
